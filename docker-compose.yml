services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kampala-nonstop-api}-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kampala_nonstop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kampala_nonstop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - api

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME:-kampala-nonstop-api}-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-kampala_nonstop}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4201}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kampala-nonstop-api}-nginx
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - api

  adminer:
    image: adminer:4
    container_name: ${COMPOSE_PROJECT_NAME:-kampala-nonstop-api}-adminer
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api
    profiles:
      - dev

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME:-kampala-nonstop-api}-queue
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-kampala_nonstop}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4201}
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: php artisan queue:work database --sleep=1 --tries=3 --backoff=10 --timeout=90 --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - api

volumes:
  postgres_data:
  vendor_data:

networks:
  api:
    driver: bridge
